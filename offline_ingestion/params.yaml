# 知识沉淀评测参数。options 与生产 PipelineOptions 对齐；不要写密钥。
# backend_url / mcp_url 可被 QASYSTEM_BACKEND_URL / QASYSTEM_MCP_URL 覆盖。

backend_url: http://127.0.0.1:8006
# 默认 {backend_url}/mcp。插件阶段调用 kg_extract_v2。
mcp_url: null
poll_interval_seconds: 2
poll_timeout_seconds: 3600

options:
  parser:
    engine: auto
    force: false
    page_sharding: auto
    page_shard_size: 0
    max_page_shards: 16
    mineru_options:
      language: ch
      ocr_mode: auto
      table_enable: true
      formula_enable: true
    keep_page_edges: first_page
    page_edge_min_chars: 3
  chunking:
    strategy: recursive
    size: 4000
    chunk_overlap: 0
    chunk_threshold: 12000
    similarity: 0.6
    separators: null
    size_unit: char
    breakpoint_method: percentile
  extraction:
    # 本次评测用 chat 模型，避免 deepseek-v4-flash 思考耗尽 max_output_tokens。
    # 只覆盖本脚本发出的抽取请求，不改 Backend 环境默认模型。
    model: deepseek-chat
    merge: true
  storage:
    persist_graph: false
    knowledge_space_id: null

# 抽取结果评分：默认 LLM-judge（与 v2_benchmark_eval 同一套规则），identity 仅作对照。
# judge 的地址/模型优先读环境变量 KG_EXTRACT_LLM_*，不要把密钥写进本文件。
eval:
  match_mode: llm          # llm | identity
  judge_model: null        # 默认 KG_EXTRACT_LLM_MODEL 或 deepseek-v4-flash
  judge_base_url: null     # 默认 KG_EXTRACT_LLM_BASE_URL
  judge_timeout_seconds: 300
  judge_max_tokens: 8192
  judge_batch_size: 20

# 每个类型共用一份本体；也可在 <类型>/<case>/ontology 下放 case 级本体。
groups: {}
