# HTTP 编排参数。options 与生产 PipelineOptions 对齐；不要写密钥。
# backend_url 可被环境变量 QASYSTEM_BACKEND_URL 覆盖。

backend_url: http://127.0.0.1:8006
poll_interval_seconds: 2
poll_timeout_seconds: 3600

options:
  parser:
    engine: auto
    force: false
    page_sharding: auto
    page_shard_size: 0
    max_page_shards: 16
    mineru_options:
      language: ch
      ocr_mode: auto
      table_enable: true
      formula_enable: true
    keep_page_edges: first_page
    page_edge_min_chars: 3
  chunking:
    strategy: recursive
    size: 4000
    chunk_overlap: 0
    chunk_threshold: 12000
    similarity: 0.6
    separators: null
    size_unit: char
    breakpoint_method: percentile
  extraction:
    model: null
    merge: true
  storage:
    persist_graph: false
    knowledge_space_id: null

# ontology 是后端 knowledge-ingestion 的必填字段（PlantUML 文本）。
# 路径指向该组权威本体：单文件，或目录（其中 .puml/.uml 排序后拼成一个字符串再上传）。
groups:
  公文:
    ontology: 公文/ontology
  标准:
    ontology: 标准/ontology
  规则:
    ontology: 规则/ontology
