              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#FFD700", "font": {"color": "black"}, "id": "121", "label": "\u5ba3\u6b66\u95e8\u7ad9", "shape": "dot", "size": 30, "title": "ID: 121\nLabels: Station"}, {"color": "#FFD700", "font": {"color": "black"}, "id": "122", "label": "\u83dc\u5e02\u53e3\u7ad9", "shape": "dot", "size": 30, "title": "ID: 122\nLabels: Station"}, {"color": "#FFD700", "font": {"color": "black"}, "id": "132", "label": "\u5ba3\u6b66\u95e8\u7ad94", "shape": "dot", "size": 30, "title": "ID: 132\nLabels: Station"}, {"color": "#FFD700", "font": {"color": "black"}, "id": "123", "label": "\u5317\u4eac\u5357\u7ad9", "shape": "dot", "size": 30, "title": "ID: 123\nLabels: Station"}]);
                  edges = new vis.DataSet([{"arrows": "to", "color": "#666666", "from": "121", "label": "TRANSFER", "title": "TRANSFER", "to": "132", "width": 2}, {"arrows": "to", "color": "#666666", "from": "121", "label": "CONNECTS", "title": "CONNECTS", "to": "122", "width": 2}, {"arrows": "to", "color": "#666666", "from": "122", "label": "\u8fde\u63a5", "title": "\u8fde\u63a5", "to": "123", "width": 2}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {"physics": {"forceAtlas2Based": {"gravitationalConstant": -50, "centralGravity": 0.01, "springLength": 200, "springConstant": 0.08}, "maxVelocity": 50, "solver": "forceAtlas2Based", "timestep": 0.35, "stabilization": {"iterations": 150}}};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
