# 知识沉淀评测参数。options 与生产 PipelineOptions 对齐；不要写密钥。
# backend_url / mcp_url 可被 QASYSTEM_BACKEND_URL / QASYSTEM_MCP_URL 覆盖。

backend_url: http://127.0.0.1:8006
# 默认 {backend_url}/mcp。插件阶段调用 kg_extract_v2。
mcp_url: null
poll_interval_seconds: 2
poll_timeout_seconds: 3600

options:
  parser:
    engine: auto
    force: false
    page_sharding: auto
    page_shard_size: 0
    max_page_shards: 16
    mineru_options:
      language: ch
      ocr_mode: auto
      table_enable: true
      formula_enable: true
    keep_page_edges: first_page
    page_edge_min_chars: 3
  chunking:
    strategy: recursive
    size: 4000
    chunk_overlap: 0
    chunk_threshold: 12000
    similarity: 0.6
    separators: null
    size_unit: char
    breakpoint_method: percentile
  extraction:
    # 抽取算法版本由 Backend 环境变量 KG_EXTRACT_ALGO_VERSION 控制：
    # latest（默认，使用独立的 latest 包）或显式 v2 / v3 / v3.1 / v3.2；本文件不设置。
    # 对比版本时先固定切片：先跑 --mode chunk-extract，
    # 再换版本跑 --mode extract --from-run <上次运行>，保证两次喂入的切片完全相同。
    # 本次评测用 chat 模型，避免 deepseek-v4-flash 思考耗尽 max_output_tokens。
    # 只覆盖本脚本发出的抽取请求，不改 Backend 环境默认模型。
    model: deepseek-chat
    merge: true
  storage:
    persist_graph: false
    knowledge_space_id: null

# 抽取结果评分：默认 LLM-judge（语义一对一匹配），identity 仅作对照。
# judge 地址/模型：QASYSTEM_JUDGE_* > 本节配置 > KG_EXTRACT_LLM_*。
# key：QASYSTEM_JUDGE_API_KEY > KG_EXTRACT_LLM_API_KEY；不要把密钥写进本文件。
# LLM 模式缺地址退出 1；judge 失败保留 identity_fallback 诊断并使质量门禁失败。
eval:
  match_mode: llm          # llm | identity
  judge_model: null        # 无独立配置时兼容 KG_EXTRACT_LLM_MODEL，最后默认 deepseek-v4-flash
  judge_base_url: null     # 无独立配置时兼容 KG_EXTRACT_LLM_BASE_URL
  judge_timeout_seconds: 300
  # B 方案：双侧窗口扫全图 + 候选边最大匹配。本地 Qwen 8192：小窗 + 超长自动拆窗。
  judge_max_tokens: 1024
  judge_batch_size: 8
  # predicted / golden 窗口；本地匹配饱和时跳过 judge，否则每对恰好看一次。
  judge_golden_batch_size: 12
  judge_max_concurrency: 4
  judge_response_format: auto
  # DeepSeek thinking=disabled；SiliconFlow enable_thinking=false；其它（Qwen/vLLM）chat_template_kwargs。
  judge_disable_thinking: true

# 小样本评测入口 python3 eval/mini_eval.py；不影响 run.py 的选择范围。
mini_eval:
  cases_per_type: 1       # 每类默认数量，只允许 1 或 2；不足时取全部
  per_type:
    official: 2          # 类型级覆盖；其余类型仍各取 1 个
  selection: first       # first=按 case 目录名取前 N 个；random=随机抽样
  seed: 42               # 仅 random 使用；固定整数可复现，null 每次重新抽样

# 历史批次保留天数：实际评测前清理 tmp/eval/runs/ 下过期批次；dry-run 不清理。
# 按 <YYYYMMDD-HHMMSS> 时间戳判定；from-run、reuse-extract-from、baseline 引用均保护。
# <=0 表示不清理；命令行 --runs-retention-days 优先于本配置。
runs_retention_days: 30

# 每个类型共用一份本体；也可在 <类型>/<case>/ontology 下放 case 级本体。
groups: {}
