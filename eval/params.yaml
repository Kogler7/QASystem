# 知识沉淀评测参数。options 与生产 PipelineOptions 对齐；不要写密钥。
# backend_url / mcp_url 可被 QASYSTEM_BACKEND_URL / QASYSTEM_MCP_URL 覆盖。

backend_url: http://127.0.0.1:8006
# 默认 {backend_url}/mcp。插件阶段调用 kg_extract_v2。
mcp_url: null
poll_interval_seconds: 2
poll_timeout_seconds: 3600

options:
  parser:
    engine: auto
    force: false
    page_sharding: auto
    page_shard_size: 0
    max_page_shards: 16
    mineru_options:
      language: ch
      ocr_mode: auto
      table_enable: true
      formula_enable: true
    keep_page_edges: first_page
    page_edge_min_chars: 3
  chunking:
    strategy: recursive
    size: 4000
    chunk_overlap: 50
    similarity: 0.6
    separators: null
    size_unit: char
    breakpoint_method: percentile
  extraction:
    # 命令行 --extract-* > 本节非 null 值 > Backend 默认值。
    # provider 是服务端 KG_EXTRACT_PROVIDERS_JSON 中的配置名，不填写 URL/密钥。
    version: null
    provider: null
    request_timeout: null
    document_timeout: null
    # 对比版本时先固定切片：先跑 --mode chunk-extract，
    # 再换版本跑 --mode extract --from-run <上次运行>，保证两次喂入的切片完全相同。
    # 留空使用供应商配置的模型；默认供应商再沿用 Backend 环境默认值。
    model: null
    merge: true
  storage:
    persist_graph: false
    knowledge_space_id: null

# 抽取结果评分：默认 LLM-judge（语义一对一匹配），identity 仅作对照。
# judge 地址/模型：命令行 > QASYSTEM_JUDGE_* > 本节配置 > 本机 Clef。
# key：默认 QASYSTEM_JUDGE_API_KEY，chat 兼容 KG_EXTRACT_LLM_API_KEY；不要把密钥写进本文件。
# Chat 模式缺地址退出 1；judge 失败保留 identity_fallback 诊断并使质量门禁失败。
eval:
  match_mode: llm          # llm | identity
  judge_model: clef-flash
  judge_adapter: auto      # clef-flash/nanojev 用 systemone，其他模型用 chat
  judge_base_url: null     # Clef 默认 CLEF_SERVICE_URL 或 http://127.0.0.1:8188
  judge_timeout_seconds: 300
  judge_max_tokens: 8192
  judge_batch_size: 20
  # judge 单次 prompt 里放多少条：predicted 窗口 / golden 窗口。两侧都切窗口，
  # 本地匹配饱和时跳过 judge；否则完整扫描 golden × predicted，每对出现一次，
  # 收齐候选后统一最大匹配。窗口越大调用越少、单次 prompt 越长。
  judge_golden_batch_size: 40
  # judge 并发 worker 数（每个 worker 用独立客户端，诊断信息互不覆盖）。
  judge_max_concurrency: 4
  # Chat 接口格式：auto 为官方 DeepSeek 使用 json_object，其他服务优先 json_schema。
  # json_object / json_schema 可显式指定起始格式；结果均在本地校验结构。
  judge_response_format: auto
  # 官方 DeepSeek 使用 thinking=disabled；SiliconFlow 使用 enable_thinking=false。
  judge_disable_thinking: true

# 小样本评测入口 python3 eval/mini_eval.py；不影响 run.py 的选择范围。
mini_eval:
  cases_per_type: 1       # 每类默认数量，只允许 1 或 2；不足时取全部
  per_type:
    official: 2          # 类型级覆盖；其余类型仍各取 1 个
  selection: first       # first=按 case 目录名取前 N 个；random=随机抽样
  seed: 42               # 仅 random 使用；固定整数可复现，null 每次重新抽样

# 历史批次保留天数：实际评测前清理 tmp/eval/runs/ 下过期批次；dry-run 不清理。
# 按 <YYYYMMDD-HHMMSS> 时间戳判定；from-run、reuse-extract-from、baseline 引用均保护。
# <=0 表示不清理；命令行 --runs-retention-days 优先于本配置。
runs_retention_days: 30

# 每个类型共用一份本体；也可在 <类型>/<case>/ontology 下放 case 级本体。
groups: {}
