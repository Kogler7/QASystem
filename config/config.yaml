# ==================== EDC 全局配置 ====================
core:
  max_layer: 2
  initial_head_entity_path: "/workspace/llmkg/edc-main/head_entity_2.txt"
  initial_schema_path: null
  enrich_schema: true
  loglevel: "DEBUG"
  output_dir: "./output/tmp"

# ==================== 三元组抽取 ExtractTriples ====================
extract_triples:
  llm: "gpt"
  prompt_template: "./prompt_templates/extract_triples_template.txt"
  few_shot_examples: "./few_shot_examples/example/oie_few_shot_examples.txt"
  error_correction_template_dir: "./prompt_templates/errors/"

# ==================== 开放信息抽取 OIE ====================
oie:
  llm: "gpt"
  prompt_template: "templates/oie.txt"
  few_shot_examples: "templates/oie_fs.txt"

# ==================== Schema Definition ====================
schema_def:
  llm: "gpt"
  prompt_template: "./prompt_templates/sd_template.txt"
  few_shot_examples: "./few_shot_examples/example/sd_few_shot_examples.txt"

# ==================== Schema Canonicalization ====================
schema_canon:
  llm: "gpt"
  embedder: "BAAI/bge-small-zh"
  prompt_template: "./prompt_templates/sc_template.txt"

# ==================== Refinement（EE, SR, OIE refine 等） ====================
refinement:
  sr_adapter: null
  sr_embedder: "BAAI/bge-small-zh"
  oie_refine_template: "./prompt_templates/oie_r_template.txt"
  oie_refine_few_shot: "./few_shot_examples/example/oie_few_shot_refine_examples.txt"

  ee_llm: "gpt"
  ee_prompt_template: "./prompt_templates/ee_template.txt"
  ee_few_shot_examples: "./few_shot_examples/example/ee_few_shot_examples.txt"

  em_prompt_template: "./prompt_templates/em_template.txt"

classifier:
  batch_size: 16

