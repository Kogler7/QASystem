# ==================== EDC 全局配置 ====================
global:
  loglevel: INFO
  max_layer: 2

# ==================== 三元组抽取 ExtractTriples ====================
extract_triples:
  llm: gpt
  template: ./prompt_templates/extract_triples_template.txt
  error_correction_dir: ./prompt_templates/errors/
  few_shot: ./few_shot_examples/example/oie_few_shot_examples.txt

# ==================== 开放信息抽取 OIE ====================
oie:
  llm: gpt
  template: ./prompt_templates/oie_template.txt
  few_shot: ./few_shot_examples/example/oie_few_shot_examples.txt

# ==================== Schema Definition ====================
schema_definition:
  llm: gpt
  template: ./prompt_templates/sd_template.txt
  few_shot: ./few_shot_examples/example/sd_few_shot_examples.txt

# ==================== Schema Canonicalization ====================
schema_canonicalization:
  llm: gpt
  embedder: BAAI/bge-small-zh
  template: ./prompt_templates/sc_template.txt

# ==================== Refinement（EE, SR, OIE refine 等） ====================
refinement:
  sr_adapter_path: null
  sr_embedder: BAAI/bge-small-zh

  oie_refine_template: ./prompt_templates/oie_r_template.txt
  oie_refine_few_shot: ./few_shot_examples/example/oie_few_shot_refine_examples.txt

  ee_llm: gpt
  ee_template: ./prompt_templates/ee_template.txt
  ee_few_shot: ./few_shot_examples/example/ee_few_shot_examples.txt

  em_template: ./prompt_templates/em_template.txt

# ==================== 输入输出 ====================
io:
  input_text: ./datasets/example.txt
  target_schema: ./schemas/example_schema.csv
  enrich_schema: true

  output_dir: ./output/tmp
