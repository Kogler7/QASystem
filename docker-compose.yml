x-qasystem-process-environment: &qasystem-process-environment
  ENVIRONMENT: production
  PYTHONPATH: /app:/app/agent
  PYTHONUNBUFFERED: "1"

services:
  backend:
    image: ${QASYSTEM_ENV_IMAGE:?Run ops config to generate configuration}
    pull_policy: never
    container_name: qasystem_backend
    restart: unless-stopped
    init: true
    entrypoint: ["python", "/app/docker/config_guard.py", "--project-dir", "/app", "--runtime-dir", "/app/runtime-config", "--exec"]
    gpus: all
    env_file:
      - .env
    environment: *qasystem-process-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 整项目目录挂载为 /app（只读）；backend 数据与 Agent 输出由下方
      # 命名卷覆盖，写操作不回落到源码目录。
      - ${QASYSTEM_SOURCE_DIR:?Run ops config to generate configuration}:/app:ro
      - ./runtime-config:/app/runtime-config:ro
      - ./runtime-config/observed:/app/runtime-config/observed
      - ./.env:/app/.env:ro
      - ./.env.example:/app/deployment.env.example:ro
      - ${HOST_MODELS_DIR:?Run ops config to generate configuration}:/models:ro
      # MinerU 4.0 会在模型根目录下写 .locks 互斥锁（下载/加载时），模型本体仍只读：
      # 这里只把 .locks 这一层叠成可写挂载。宿主需先建好该目录。
      - ${MINERU4_LOCK_DIR:?Run ops config to generate configuration}:/models/mineru4/.locks
      - backend-data:/app/backend/data
      # preproc 默认输出 cwd/tmp/processed（/app/backend/tmp），源码只读，
      #  scratch 写入命名卷；宿主需预建 backend/tmp 与 backend/data 挂载点。
      - backend-tmp:/app/backend/tmp
    working_dir: /app/backend
    command: python -m app.execution.supervisor
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND:?Run ops config to generate configuration}:${BACKEND_HOST_PORT:?Run ops config to generate configuration}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  agent:
    image: ${QASYSTEM_ENV_IMAGE:?Run ops config to generate configuration}
    pull_policy: never
    container_name: qasystem_agent
    restart: unless-stopped
    init: true
    entrypoint: ["python", "/app/docker/config_guard.py", "--project-dir", "/app", "--runtime-dir", "/app/runtime-config", "--exec"]
    env_file:
      - .env
    environment: *qasystem-process-environment
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 整项目目录挂载为 /app（只读）；Agent 输出写入下方命名卷。
      - ${QASYSTEM_SOURCE_DIR:?Run ops config to generate configuration}:/app:ro
      - ./runtime-config:/app/runtime-config:ro
      - ./runtime-config/observed:/app/runtime-config/observed
      - ./.env:/app/.env:ro
      - ./.env.example:/app/deployment.env.example:ro
      - agent-output:/app/agent/image_result
    working_dir: /app
    command: python -m agentcode.api --host 0.0.0.0 --port 9180
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${AGENT_BIND:?Run ops config to generate configuration}:${AGENT_HOST_PORT:?Run ops config to generate configuration}:9180"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9180/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  clef:
    image: ${QASYSTEM_ENV_IMAGE:?Run ops config to generate configuration}
    pull_policy: never
    profiles: [decisions]
    container_name: qasystem_clef
    restart: unless-stopped
    init: true
    entrypoint: ["python", "/app/docker/config_guard.py", "--project-dir", "/app", "--runtime-dir", "/app/runtime-config", "--exec"]
    gpus: all
    env_file:
      - .env
    environment: *qasystem-process-environment
    volumes:
      - ${QASYSTEM_SOURCE_DIR:?Run ops config to generate configuration}:/app:ro
      - ./runtime-config:/app/runtime-config:ro
      - ./runtime-config/observed:/app/runtime-config/observed
      - ./.env:/app/.env:ro
      - ./.env.example:/app/deployment.env.example:ro
      - ${HOST_MODELS_DIR:?Run ops config to generate configuration}:/models:ro
    working_dir: /app
    command: ["/bin/sh", "-ec", "test -n \"$$CLEF_CUDA_VISIBLE_DEVICES\" || { echo 'Set CLEF_CUDA_VISIBLE_DEVICES to a dedicated GPU'; exit 1; }; exec python -m clef_service"]
    healthcheck:
      test: ["CMD-SHELL", "curl --noproxy '*' -fsS http://127.0.0.1:$$CLEF_PORT/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  nanojev:
    image: ${QASYSTEM_ENV_IMAGE:?Run ops config to generate configuration}
    pull_policy: never
    profiles: [decisions]
    container_name: qasystem_nanojev
    restart: unless-stopped
    init: true
    entrypoint: ["python", "/app/docker/config_guard.py", "--project-dir", "/app", "--runtime-dir", "/app/runtime-config", "--exec"]
    gpus: all
    env_file:
      - .env
    environment: *qasystem-process-environment
    volumes:
      - ${QASYSTEM_SOURCE_DIR:?Run ops config to generate configuration}:/app:ro
      - ./runtime-config:/app/runtime-config:ro
      - ./runtime-config/observed:/app/runtime-config/observed
      - ./.env:/app/.env:ro
      - ./.env.example:/app/deployment.env.example:ro
      - ${HOST_MODELS_DIR:?Run ops config to generate configuration}:/models:ro
    working_dir: /app
    command: python -m nanojev_service
    healthcheck:
      test: ["CMD-SHELL", "curl --noproxy '*' -fsS http://127.0.0.1:$$NANOJEV_PORT/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  redis:
    image: redis:7-alpine
    container_name: qasystem_agent_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - agent-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agent-redis-data:
  backend-data:
  backend-tmp:
  agent-output:
