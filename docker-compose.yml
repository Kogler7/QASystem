services:
  backend:
    image: ${BACKEND_IMAGE:-qasystem-backend:latest}
    pull_policy: never
    container_name: qasystem_backend
    restart: unless-stopped
    gpus: all
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app:/app/agent
      CUDA_VISIBLE_DEVICES: ${GPU_DEVICE_IDS:-4,5,6,7}
      LIBREOFFICE_PATH: ${LIBREOFFICE_PATH:-/usr/bin/soffice}
    volumes:
      - ${HOST_MODELS_DIR:-./deploy/models}:/models:ro
      - backend-data:/app/backend/data
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_HOST_PORT:-8006}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 240s

  agent:
    image: ${BACKEND_IMAGE:-qasystem-backend:latest}
    pull_policy: never
    container_name: qasystem_agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app:/app/agent
      AGENT_MCP_URL: http://backend:8000/mcp
      TASK_STORE_REDIS_URL: redis://redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - agent-output:/app/agent/image_result
    working_dir: /app
    command: python -m agentcode.api --host 0.0.0.0 --port 9180
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9180/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: qasystem_agent_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - agent-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agent-redis-data:
  backend-data:
  agent-output:
