project: intent-gpt-track
entity: your-entity-name
data_dir: data
dataset: track
seed: 7
label_type: original
known_cls_ratio: 0.50
cluster_num_factor: 1.0
labeled_ratio: 0.1

gpt_model: Qwen/Qwen3-8B # Qwen/Qwen3-8B #gpt-4
temperature: 0.15

model_name: models/bert-base-uncased
max_seq_length: 128
batch_size: 16
num_few_shot_examples: 10
intent_embeddings: sentence-transformer # text-embedding-ada-002, sentence-transformer or false
verbose: False
prompt_type: hard_prompt
force_recompute: false
compute_hard_samples: false
N_hard_samples: 50
samples_x_class: 2
sample_few_shot_every_iteration: true

semantic_few_shot: true
feedback_discovered_categories: true
semantic_feedback_discovery: false
semantic_feedback_discovery_after_test_sample: false
k_nearest_feedback: 10
number_semantic_feedback: 20
k_nearest_few_shot: 5
start_with_known_categories: true

attack: true
attack_probability: 0.2

scramble_test_samples: false
scramble_known_intents: false

eps_dbscan: 0.5
use_embeddings_for_labels: true

use_wandb: false

only_validate_results: false
feedback_initial_categories: false

