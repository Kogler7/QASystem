services:
  backend:
    image: ${QASYSTEM_REMOTE_ENV_IMAGE:-qasystem-env-v1-remote-only}
    pull_policy: never
    container_name: qasystem_backend
    restart: unless-stopped
    init: true
    mem_limit: ${BACKEND_MEMORY_LIMIT:-2750m}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${QASYSTEM_SOURCE_DIR:-.}:/app:ro
      - backend-data:/app/backend/data
    working_dir: /app/backend
    command: python -m app.execution.supervisor
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_HOST_PORT:-8006}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

  agent:
    image: ${QASYSTEM_REMOTE_ENV_IMAGE:-qasystem-env-v1-remote-only}
    pull_policy: never
    container_name: qasystem_agent
    restart: unless-stopped
    init: true
    mem_limit: ${AGENT_MEMORY_LIMIT:-512m}
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${QASYSTEM_SOURCE_DIR:-.}:/app:ro
      - agent-output:/app/agent/image_result
    working_dir: /app
    command: python -m agentcode.api --host 0.0.0.0 --port 9180
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9180/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: qasystem_agent_redis
    restart: unless-stopped
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    command: redis-server --appendonly yes
    volumes:
      - agent-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  agent-redis-data:
  backend-data:
  agent-output:
