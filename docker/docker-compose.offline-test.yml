services:
  mock-llm:
    image: ${QASYSTEM_ENV_IMAGE:-qasystem-env-v1}
    pull_policy: never
    volumes:
      - ${QASYSTEM_SOURCE_DIR:-..}/docker:/app/docker:ro
    entrypoint: ["python", "/app/docker/offline_mock_llm.py"]
    networks: [offline]

  backend:
    image: ${QASYSTEM_ENV_IMAGE:-qasystem-env-v1}
    pull_policy: never
    gpus: all
    environment:
      ENVIRONMENT: offline-test
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app:/app/agent
      LIBREOFFICE_PATH: /usr/bin/soffice
      MINERU_MODEL_SOURCE: local
      MINERU_CONFIG_PATH: /app/algorithm/preproc/mineru.json
      MINERU_MODEL_PIPELINE_PATH: /models/mineru/pipeline
      MINERU_MODEL_VLM_PATH: /models/mineru/vlm
      VECTOR_MODEL_PATH: /models/bge-small-zh-v1.5
      CONFIDENCE_SBERT_MODEL_PATH: /models/bge-small-zh-v1.5
      NL2CYPHER_EMBEDDING_MODEL_PATH: /models/bge-small-zh-v1.5
      DATABASE_HOST: ""
      APPLICATION_SERVICE_URL: ""
      KG_EXTRACT_LLM_BASE_URL: http://mock-llm:9000/v1
      KG_EXTRACT_LLM_API_KEY: offline-test
      KG_EXTRACT_LLM_MODEL: offline-mock
      KG_EXTRACT_LLM_JSON_RETRIES: "0"
    volumes:
      - ${QASYSTEM_SOURCE_DIR:-..}/backend:/app/backend:ro
      - ${QASYSTEM_SOURCE_DIR:-..}/algorithm:/app/algorithm:ro
      - ${QASYSTEM_SOURCE_DIR:-..}/mcp_services:/app/mcp_services:ro
      - ${QASYSTEM_SOURCE_DIR:-..}/agent:/app/agent:ro
      - ${QASYSTEM_SOURCE_DIR:-..}/external_services:/app/external_services:ro
      - ${HOST_MODELS_DIR:-../deploy/models}:/models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks: [offline]
    depends_on: [mock-llm]

  verifier:
    image: ${QASYSTEM_ENV_IMAGE:-qasystem-env-v1}
    pull_policy: never
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${QASYSTEM_SOURCE_DIR:-..}/docker:/app/docker:ro
      - ${OFFLINE_SAMPLES_DIR:-../test_data/parse}:/samples:ro
    entrypoint: ["python", "/app/docker/offline_validation.py"]
    command: ["--samples", "/samples"]
    networks: [offline]
    depends_on: [backend]
    restart: "no"

networks:
  offline:
    internal: true
