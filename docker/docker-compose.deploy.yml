services:
  backend:
    image: ${BACKEND_IMAGE:-qasystem-backend:latest}
    pull_policy: never
    container_name: railway_backend
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app:/app/agentcode
      DATABASE_URL: ${DATABASE_URL:-mysql+asyncmy://root:123456@host.docker.internal:3306/railway_db}
      MCP_DATABASE_URL: ${MCP_DATABASE_URL:-mysql+pymysql://root:123456@host.docker.internal:3306/railway_db}
      MCP_IMAGE_OUTPUT_DIR: ${MCP_IMAGE_OUTPUT_DIR:-/app/agentcode/image_result}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:9999}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-Qwen/Qwen3-8B}
      OPENCODE_CONFIG_CONTENT: ${OPENCODE_CONFIG_CONTENT:-}
    volumes:
      - ./qasystem-runtime:/app
      - ${HOST_MODELS_DIR:-./models}:/models:ro
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_HOST_PORT:-8006}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 240s
