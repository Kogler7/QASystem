services:
  llm:
    image: ${QASYSTEM_ENV_IMAGE:-qasystem-env-v1}
    pull_policy: never
    profiles: [llm]
    restart: unless-stopped
    init: true
    entrypoint: ["python", "/app/docker/config_guard.py", "--project-dir", "/app", "--runtime-dir", "/app/runtime-config", "--exec"]
    gpus: all
    env_file:
      - .env
    environment:
      CUDA_VISIBLE_DEVICES: ${LLM_GPU_DEVICE_IDS:?Set LLM_GPU_DEVICE_IDS for the llm profile}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - ${HOST_MODELS_DIR:-./deploy/models}:/models:ro
      - ${QASYSTEM_SOURCE_DIR:-.}:/app:ro
      - ${QASYSTEM_RUNTIME_CONFIG_DIR:-./runtime-config}:/app/runtime-config:ro
      - ./.env:/app/.env:ro
      - ./.env.example:/app/deployment.env.example:ro
    command:
      - /bin/sh
      - -ec
      - >-
        exec vllm serve "/models/$$LLM_MODEL_DIR"
        --served-model-name "$$LLM_SERVED_MODEL_NAME"
        --gpu-memory-utilization "$$LLM_GPU_MEMORY_UTILIZATION"
        --max-model-len "$$LLM_MAX_MODEL_LEN"
        --max-num-seqs "$$LLM_MAX_NUM_SEQS"
        --max-num-batched-tokens "$$LLM_MAX_NUM_BATCHED_TOKENS"
        --dtype "$$LLM_DTYPE" --language-model-only
    ports:
      - "${LLM_BIND}:${LLM_HOST_PORT}:8000"
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8000/health]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

